spring:
  application:
    name: photo-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_PHOTO_HOST:localhost}:${POSTGRES_PHOTO_PORT:5432}/${POSTGRES_PHOTO_DB:agnitio_photo}
    username: ${POSTGRES_PHOTO_USER:agnitio_user}
    password: ${POSTGRES_PHOTO_PASSWORD:agnitio_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:agnitio_rabbit}
    password: ${RABBITMQ_DEFAULT_PASS:rabbit_secret}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
