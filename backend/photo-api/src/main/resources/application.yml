spring:
  application:
    name: photo-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_PHOTO_HOST:localhost}:${POSTGRES_PHOTO_PORT:5432}/${POSTGRES_PHOTO_DB:agnitio_photo}
    username: ${POSTGRES_PHOTO_USER:agnitio_user}
    password: ${POSTGRES_PHOTO_PASSWORD:agnitio_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:agnitio_rabbit}
    password: ${RABBITMQ_DEFAULT_PASS:rabbit_secret}

server:
  port: 8080

agnitio:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:agnitio-photos}
      access-key: ${S3_ACCESS_KEY:minio_admin}
      secret-key: ${S3_SECRET_KEY:minio_secret_key}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  vision:
    base-url: ${VISION_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  logging:
    loki:
      url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
