[project]
name = "agnitio-vision-service"
version = "0.1.0"
description = "Computer vision service for face detection, embeddings and pgvector search"
license = { text = "PolyForm Noncommercial License 1.0.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "pika>=1.3.2",
    "boto3>=1.36.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]
ml = [
    "insightface>=0.7.3",
    "onnxruntime>=1.20.0",
    # OpenCV (cv2) comes from insightface itself, which depends on "opencv-python".
    # Do not add "opencv-python-headless": both provide the same "cv2" module and conflict.
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
